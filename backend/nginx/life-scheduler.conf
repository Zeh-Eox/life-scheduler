upstream life_scheduler_backend {
    server 127.0.0.1:3009;
    keepalive 32;
}

server {
    listen 80;
    server_name lifescheduler-api.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lifescheduler-api.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/lifescheduler-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifescheduler-api.duckdns.org/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://life_scheduler_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/life-scheduler-access.log;
    error_log  /var/log/nginx/life-scheduler-error.log;
}